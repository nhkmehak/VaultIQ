resources:
  repositories:
    - repository: deployments
      type: github
      name: nhkmehak/vaultiq-deployments
      endpoint: github-patt

trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: vaultiq-secrets
  - name: acrConnection
    value: 'vault-acr-conn'
  - name: registryName
    value: 'vaultregistry.azurecr.io'

stages:
  # =========================================================================
  # STAGE 1 - Build & Push Images
  # =========================================================================
  - stage: BuildAndPushStage
    displayName: 'Stage 1 - Build & Push Images'
    jobs:
      - job: BuildJob
        steps:
          - checkout: self
            path: gripinvest

          - checkout: deployments
            path: deployment-repo

          - task: npmAuthenticate@0
            displayName: 'Authenticate npm with Azure Artifacts Feed'
            inputs:
              workingFile: '$(Agent.BuildDirectory)/gripinvest/backend/.npmrc'

          - script: |
              TOKEN=$(cat $(Agent.BuildDirectory)/gripinvest/backend/.npmrc | grep _authToken | cut -d'=' -f2)
              echo "##vso[task.setvariable variable=NPM_TOKEN]$TOKEN"
            displayName: 'Extract npm token'

          - task: Docker@2
            displayName: 'Build Backend Image'
            inputs:
              containerRegistry: '$(acrConnection)'
              repository: 'vaultiq-backend'
              command: 'build'
              Dockerfile: '$(Agent.BuildDirectory)/gripinvest/backend/Dockerfile'
              tags: '$(Build.BuildId)'
              arguments: '--build-arg NPM_TOKEN=$(NPM_TOKEN)'

          - task: Docker@2
            displayName: 'Push Backend Image'
            inputs:
              containerRegistry: '$(acrConnection)'
              repository: 'vaultiq-backend'
              command: 'push'
              tags: '$(Build.BuildId)'

          - task: Docker@2
            displayName: 'Build and Push Frontend Image'
            inputs:
              containerRegistry: '$(acrConnection)'
              repository: 'vaultiq-frontend'
              command: 'buildAndPush'
              Dockerfile: '$(Agent.BuildDirectory)/gripinvest/frontend/Dockerfile'
              tags: '$(Build.BuildId)'

          - publish: $(Agent.BuildDirectory)/deployment-repo
            artifact: deployment-files
            displayName: 'Publish deployment repo as artifact'

  # =========================================================================
  # STAGE 2 - Deploy to Staging
  # =========================================================================
  - stage: DeployToStagingStage
    displayName: 'Stage 2 - Deploy to Staging'
    dependsOn: BuildAndPushStage
    variables:
      ENVIRONMENT: 'staging'
      BACKEND_URL: 'http://20.204.201.232:5000/api'
      BACKEND_IMAGE: '$(registryName)/vaultiq-backend:$(Build.BuildId)'
      FRONTEND_IMAGE: '$(registryName)/vaultiq-frontend:$(Build.BuildId)'
      BACKEND_REPLICAS: '1'
      FRONTEND_REPLICAS: '1'
    jobs:
      - deployment: DeployStagingJob
        displayName: 'Execute Staging Deployment'
        environment: 'vault-staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: deployment-files
                  displayName: 'Download deployment files'

                # Fixed: Corrected to single artifact directory path
                - task: replacetokens@5
                  displayName: 'Fill staging values into templates'
                  inputs:
                    targetFiles: '$(Pipeline.Workspace)/deployment-files/templates/*.yaml'
                    encoding: 'auto'
                    tokenPattern: 'azpipelines'

                - task: Kubernetes@1
                  displayName: 'Login to Staging Cluster'
                  inputs:
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceEndpoint: 'vault-staging-conn'
                    namespace: 'vault-staging-ns'
                    command: 'login'

                - script: |
                    kubectl create secret generic vaultiq-secret \
                      --from-literal=DB_PASSWORD=$(DB_PASSWORD) \
                      --from-literal=JWT_SECRET=$(JWT_SECRET) \
                      --from-literal=GROQ_API_KEY=$(GROQ_API_KEY) \
                      --namespace=vault-staging-ns \
                      --dry-run=client -o yaml | kubectl apply -f -
                  displayName: 'Create K8s Secret in Staging'

                # Fixed: ConfigMap path targeted cleanly
                - task: KubernetesManifest@1
                  displayName: 'Apply ConfigMap to Staging'
                  inputs:
                    action: 'deploy'
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceConnection: 'vault-staging-conn'
                    namespace: 'vault-staging-ns'
                    manifests: |
                      $(Pipeline.Workspace)/deployment-files/templates/configmap.yaml

                # Fixed: Deployment manifest paths targeted cleanly
                - task: KubernetesManifest@1
                  displayName: 'Deploy to Staging'
                  inputs:
                    action: 'deploy'
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceConnection: 'vault-staging-conn'
                    namespace: 'vault-staging-ns'
                    manifests: |
                      $(Pipeline.Workspace)/deployment-files/templates/mysql.yaml
                      $(Pipeline.Workspace)/deployment-files/templates/backend.yaml
                      $(Pipeline.Workspace)/deployment-files/templates/frontend.yaml
                    containers: |
                      $(registryName)/vaultiq-backend:$(Build.BuildId)
                      $(registryName)/vaultiq-frontend:$(Build.BuildId)

  # =========================================================================
  # STAGE 3 - Deploy to Production
  # =========================================================================
  - stage: DeployToProductionStage
    displayName: 'Stage 3 - Deploy to Production'
    dependsOn: DeployToStagingStage
    variables:
      ENVIRONMENT: 'prod'
      BACKEND_URL: 'http://PROD_IP_HERE:5000/api'
      BACKEND_IMAGE: '$(registryName)/vaultiq-backend:$(Build.BuildId)'
      FRONTEND_IMAGE: '$(registryName)/vaultiq-frontend:$(Build.BuildId)'
      BACKEND_REPLICAS: '1'
      FRONTEND_REPLICAS: '1'
    jobs:
      - deployment: DeployProductionJob
        displayName: 'Execute Production Deployment'
        environment: 'vault-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: deployment-files
                  displayName: 'Download deployment files'

                # Fixed: Corrected to single artifact directory path
                - task: replacetokens@5
                  displayName: 'Fill prod values into templates'
                  inputs:
                    targetFiles: '$(Pipeline.Workspace)/deployment-files/templates/*.yaml'
                    encoding: 'auto'
                    tokenPattern: 'azpipelines'

                - task: Kubernetes@1
                  displayName: 'Login to Production Cluster'
                  inputs:
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceEndpoint: 'vault-prod-conn'
                    namespace: 'vault-prod-ns'
                    command: 'login'

                - script: |
                    kubectl create secret generic vaultiq-secret \
                      --from-literal=DB_PASSWORD=$(DB_PASSWORD) \
                      --from-literal=JWT_SECRET=$(JWT_SECRET) \
                      --from-literal=GROQ_API_KEY=$(GROQ_API_KEY) \
                      --namespace=vault-prod-ns \
                      --dry-run=client -o yaml | kubectl apply -f -
                  displayName: 'Create K8s Secret in Production'

                # Fixed: ConfigMap path targeted cleanly
                - task: KubernetesManifest@1
                  displayName: 'Apply ConfigMap to Production'
                  inputs:
                    action: 'deploy'
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceConnection: 'vault-prod-conn'
                    namespace: 'vault-prod-ns'
                    manifests: |
                      $(Pipeline.Workspace)/deployment-files/templates/configmap.yaml

                # Fixed: Deployment manifest paths targeted cleanly
                - task: KubernetesManifest@1
                  displayName: 'Deploy to Production'
                  inputs:
                    action: 'deploy'
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceConnection: 'vault-prod-conn'
                    namespace: 'vault-prod-ns'
                    manifests: |
                      $(Pipeline.Workspace)/deployment-files/templates/mysql.yaml
                      $(Pipeline.Workspace)/deployment-files/templates/backend.yaml
                      $(Pipeline.Workspace)/deployment-files/templates/frontend.yaml
                    containers: |
                      $(registryName)/vaultiq-backend:$(Build.BuildId)
                      $(registryName)/vaultiq-frontend:$(Build.BuildId)