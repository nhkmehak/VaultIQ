trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrConnection: 'vault-acr-conn'
  aksConnection: 'vault-aks-conn'
  registryName: 'vaultregistry.azurecr.io'

stages:
  # =========================================================================
  # STAGE 1: Build your backend and frontend code into Docker images
  # =========================================================================
  - stage: BuildAndPushStage
    displayName: 'Stage 1: Build & Push Images'
    jobs:
      - job: BuildJob
        steps:
          # Build Backend
          - task: Docker@2
            displayName: 'Compile Backend Image'
            inputs:
              containerRegistry: '$(acrConnection)'
              repository: 'vaultiq-backend'
              command: 'buildAndPush'
              Dockerfile: '**/backend/Dockerfile'
              tags: '$(Build.BuildId)'

          # Build Frontend
          - task: Docker@2
            displayName: 'Compile Frontend Image'
            inputs:
              containerRegistry: '$(acrConnection)'
              repository: 'vaultiq-frontend'
              command: 'buildAndPush'
              Dockerfile: '**/frontend/Dockerfile'
              tags: '$(Build.BuildId)'

  # =========================================================================
  # STAGE 2: Deploy to the Staging Environment (Requires Intern Approval)
  # =========================================================================
  - stage: DeployToStagingStage
    displayName: 'Stage 2: Deploy to Staging'
    dependsOn: BuildAndPushStage 
    jobs:
      - deployment: DeployStagingJob
        displayName: 'Execute Staging Deployment'
        environment: 'vault-staging' 
        strategy:
          runOnce:
            deploy:
              steps:
                # 🟢 FIX: Downloads your repo files so the agent can see vault-stack.yaml
                - checkout: self 

                - task: KubernetesManifest@1
                  displayName: 'Deploy Manifests to Staging'
                  inputs:
                    action: 'deploy'
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceConnection: '$(aksConnection)'
                    namespace: 'vault-staging-ns'
                    manifests: |
                      **/vault-stack.yaml
                    containers: |
                      $(registryName)/vaultiq-backend:$(Build.BuildId)
                      $(registryName)/vaultiq-frontend:$(Build.BuildId)

  # =========================================================================
  # STAGE 3: Deploy to the Production Environment (Requires Your Approval)
  # =========================================================================
  - stage: DeployToProductionStage
    displayName: 'Stage 3: Deploy to Production'
    dependsOn: DeployToStagingStage 
    jobs:
      - deployment: DeployProductionJob
        displayName: 'Execute Production Deployment'
        environment: 'vault-production' 
        strategy:
          runOnce:
            deploy:
              steps:
                # 🟢 FIX: Downloads your repo files so the agent can see vault-stack.yaml
                - checkout: self 

                - task: KubernetesManifest@1
                  displayName: 'Deploy Manifests to Production'
                  inputs:
                    action: 'deploy'
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceConnection: '$(aksConnection)'
                    namespace: 'vault-prod-ns'
                    manifests: |
                      **/vault-stack.yaml
                    containers: |
                      $(registryName)/vaultiq-backend:$(Build.BuildId)
                      $(registryName)/vaultiq-frontend:$(Build.BuildId)