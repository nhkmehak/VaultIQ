apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-disk-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-db
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultiq-secret
              key: DB_PASSWORD
        - name: MYSQL_DATABASE        
          valueFrom:
            configMapKeyRef:
              name: vaultiq-backend-env
              key: DB_NAME
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-disk-claim

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  type: ClusterIP
  selector:
    app: mysql-db
  ports:
  - port: 3306
    targetPort: 3306

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultiq-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultiq-backend
  template:
    metadata:
      labels:
        app: vaultiq-backend
    spec:
      containers:
      - name: backend
        image: vaultregistry.azurecr.io/vaultiq-backend
        envFrom:
        - configMapRef:
            name: vaultiq-backend-env
        - secretRef:
            name: vaultiq-secret
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: vaultiq-backend-service
spec:
  type: LoadBalancer
  selector:
    app: vaultiq-backend
  ports:
  - port: 5000
    targetPort: 5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultiq-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultiq-frontend
  template:
    metadata:
      labels:
        app: vaultiq-frontend
    spec:
      containers:
      - name: frontend
        image: vaultregistry.azurecr.io/vaultiq-frontend
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: vaultiq-backend-env
              key: BACKEND_URL
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: vaultiq-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: vaultiq-frontend
  ports:
  - port: 80
    targetPort: 3000